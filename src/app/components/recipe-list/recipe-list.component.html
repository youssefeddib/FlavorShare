<section id="categories" class="py-20 bg-gray-50">
  <div class="max-w-7xl mx-auto text-center px-4">
    <h2 class="text-4xl font-semibold mb-12 text-gray-800">Recettes à base de Poulet</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      <div 
        *ngFor="let meal of meals"
        class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300"
      >
        <a [routerLink]="['/recipe', meal.idMeal]" class="block h-full">
          <img 
            [src]="meal.strMealThumb" 
            [alt]="meal.strMeal" 
            class="w-full h-56 object-cover"
          />
          <div class="p-6 text-left">
            <h3 class="text-xl font-bold mb-2 text-gray-900">{{ meal.strMeal }}</h3>
            <p class="text-gray-600 mb-4 truncate">Cliquez pour découvrir cette délicieuse recette de poulet.</p>
            <span class="text-yellow-500 font-semibold hover:underline">Voir la recette</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
