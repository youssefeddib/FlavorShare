<div class="navbar fixed top-0 w-full bg-gray-900 text-white shadow-lg z-50">
  <div class="container mx-auto flex justify-between items-center p-4">
    <!-- Logo -->
    <a href="#" class="text-2xl font-bold text-yellow-400">FlavorShare</a>

    <!-- Desktop Navigation + Search -->
    <div class="hidden md:flex items-center space-x-6">
      <!-- Navigation Links -->
      <div class="flex space-x-4">
        <a href="/" class="hover:text-yellow-400">Accueil</a>
        <a href="/recipe-list" class="hover:text-yellow-400">Catégories</a>
        <a href="/about" class="hover:text-yellow-400">About</a>
        <a href="/contact" class="hover:text-yellow-400">Contact</a>
      </div>

      <!-- Search Bar -->
      <div class="flex items-center space-x-2">
        <input 
          type="text" 
          placeholder="Rechercher une recette..." 
          class="px-4 py-2 rounded-md bg-gray-800 border border-gray-600 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400"

    <!-- Mobile Menu Toggle -->
    <button class="md:hidden" onclick="toggleMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">

  <!-- Mobile Menu -->
  <div id="menu" class="md:hidden hidden flex flex-col items-center bg-gray-800 p-4 space-y-4">

    <a href="/recipe-list" class="text-white hover:text-yellow-400">Catégories</a>
    <a href="/about" class="text-white hover:text-yellow-400">About</a>

    <div class="w-full flex flex-col items-center space-y-2 pt-2">
      <input 
        type="text" 
        placeholder="Rechercher une recette..." 
        class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400"

        Rechercher
      </button>

<script>
  function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.classList.toggle('hidden');

</script>
